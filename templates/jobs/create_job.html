{% extends 'base.html' %}

{% block content %}
<h2>Create Job</h2>

<form method="POST">
  {% csrf_token %}

  <!-- Job Title -->
  <input type="text" name="title" class="form-control mb-2" placeholder="Job Title" required>
  
  <!-- Description -->
  <textarea name="description" class="form-control mb-2" placeholder="Job Description" required></textarea>

  <!-- Skills -->
  <input type="text" name="skills" class="form-control mb-2" placeholder="Skills (e.g. Python, Django, SQL)">

  <!-- ATS Threshold -->
  <label class="form-label">ATS Score Threshold</label>
  <input 
    type="number" 
    name="ats_threshold" 
    class="form-control mb-2" 
    placeholder="Enter ATS cutoff (e.g. 60)" 
    step="0.1"
    value="60"
  >

  <!-- Enable Threshold -->
  <div class="form-check mb-3">
    <input 
      type="checkbox" 
      name="threshold_enabled" 
      class="form-check-input" 
      id="thresholdCheck" 
      checked
    >
    <label class="form-check-label" for="thresholdCheck">
      Enable ATS Filtering (Auto shortlist candidates)
    </label>
  </div>

  <!-- Submit -->
  <button class="btn btn-success">Post Job</button>
</form>

{% if error %}
  <div class="alert alert-danger mt-3">
    {{ error }}
  </div>
{% endif %}

{% endblock %}
